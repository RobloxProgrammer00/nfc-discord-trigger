<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Action Trigger</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #090d16;
            color: #f8fafc;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            max-width: 380px;
            width: 100%;
            transition: all 0.3s ease;
        }
        .status-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: inline-block;
            animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.8; }
        }
        .title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        .status-text {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.5;
        }
        .badge {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .redirect-notice {
            margin-top: 18px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        <div id="icon" class="status-icon">⚡</div>
        <div id="title" class="title">Processing Request</div>
        <div id="status" class="status-text">Gathering metrics & dispatching payload...</div>
        <div id="badge" class="badge">INITIALIZING</div>
        <div id="redirect" class="redirect-notice" style="display: none;"></div>
    </div>

    <script>
        // Base64 Webhook URL
        const ENCODED_WEBHOOK = "aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTU1NDU3MzE1MTk3ODEyNzQyMy9oUlI2OUpVdXFCbG5EaU1DSGdLcE1iNU4xaUpyYkRkV0tTTmR5RVRPdzF3bVlOU1VBN0RFV3FtWTBsNXZRTGExRlZlbg==";

        // Optional default redirect target URL
        const DEFAULT_REDIRECT_URL = ""; 

        function decodeWebhook() {
            try {
                return atob(ENCODED_WEBHOOK).trim();
            } catch (e) {
                return "";
            }
        }

        function getGPUInfo() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return "N/A";
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                return debugInfo ? (gl.getParameter(debugInfo.UNMASKED_RENDERER_GL4) || gl.getParameter(debugInfo.UNMASKED_RENDERER)) : "N/A";
            } catch (e) {
                return "Unknown";
            }
        }

        async function processNFC() {
            const urlParams = new URLSearchParams(window.location.search);
            const isNFC = urlParams.get('source') === 'nfc';
            const customRedirect = urlParams.get('redirect') || DEFAULT_REDIRECT_URL;

            // UI Elements
            const iconEl = document.getElementById("icon");
            const titleEl = document.getElementById("title");
            const statusEl = document.getElementById("status");
            const badgeEl = document.getElementById("badge");
            const redirectEl = document.getElementById("redirect");

            // Define Embed layout & message based on trigger source
            let botName, avatarUrl, embedTitle, embedDesc, embedColor;

            if (isNFC) {
                botName = "NFC Card Scanner";
                avatarUrl = "https://cdn-icons-png.flaticon.com/512/3587/3587202.png";
                embedTitle = "🚨 REAL NFC CARD TAP DETECTED!";
                embedDesc = "A user physically tapped your NFC card with their smartphone!";
                embedColor = 3066993; // Green (#2ECC71)

                badgeEl.innerText = "📱 PHYSICAL NFC TAP";
                badgeEl.style.borderColor = "rgba(74, 222, 128, 0.4)";
                badgeEl.style.color = "#4ade80";
            } else {
                botName = "Web Visitor Tracker";
                avatarUrl = "https://cdn-icons-png.flaticon.com/512/1006/1006771.png";
                embedTitle = "🌐 DIRECT WEB VISIT / BOT DETECTED";
                embedDesc = "Someone opened the link directly in a browser, viewed your GitHub repo, or a web crawler scanned the URL.";
                embedColor = 15158332; // Red / Orange (#E74C3C)

                badgeEl.innerText = "🌐 WEB / BOT VISIT";
                badgeEl.style.borderColor = "rgba(248, 113, 113, 0.4)";
                badgeEl.style.color = "#f87171";
            }

            // System Metrics Collection
            let batteryInfo = "N/A";
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    batteryInfo = `${Math.round(battery.level * 100)}% (${battery.charging ? "Charging" : "Discharging"})`;                 } catch (e) {}             }              const screenRes = `${window.screen.width}x${window.screen.height} (${window.devicePixelRatio}x)`;
            const viewport = `${window.innerWidth}x${window.innerHeight}`;
            const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "Unknown";
            const cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Cores` : "Unknown";             const ram = navigator.deviceMemory ? `~${navigator.deviceMemory} GB` : "N/A";
            const isTouch = ('ontouchstart' in window || navigator.maxTouchPoints > 0) ? "Yes" : "No";
            const colorScheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? "Dark" : "Light";
            const orientation = window.screen.orientation ? window.screen.orientation.type : "Unknown";
            const connection = navigator.connection ? (navigator.connection.effectiveType || "Unknown").toUpperCase() : "N/A";
            const gpu = getGPUInfo();

            // Construct Payload
            const payload = {
                username: botName,
                avatar_url: avatarUrl,
                embeds: [{
                    title: embedTitle,
                    description: embedDesc,
                    color: embedColor,
                    timestamp: new Date().toISOString(),
                    fields: [
                        { name: "🎯 Source Status", value: isNFC ? "`PHYSICAL_NFC_CARD`" : "`WEB_DIRECT_OR_BOT`", inline: true },
                        { name: "📱 Platform", value: navigator.platform || "Unknown", inline: true },
                        { name: "⏰ Timezone", value: timeZone, inline: true },

                        { name: "🖥 Resolution", value: screenRes, inline: true },
                        { name: "📐 Viewport", value: viewport, inline: true },
                        { name: "🎨 Color Scheme", value: colorScheme, inline: true },

                        { name: "⚡ CPU Cores", value: cores, inline: true },
                        { name: "🧠 Memory (RAM)", value: ram, inline: true },
                        { name: "🔋 Battery", value: batteryInfo, inline: true },

                        { name: "📶 Connection", value: connection, inline: true },
                        { name: "📱 Touch Screen", value: isTouch, inline: true },
                        { name: "🔄 Orientation", value: orientation, inline: true },

                        { name: "🎮 GPU", value: `\`\`\`${gpu}\`\`\``, inline: false },
                        { name: "🌐 User-Agent", value: `\`\`\`${navigator.userAgent}\`\`\``, inline: false }
                    ]
                }]
            };

            const webhookUrl = decodeWebhook();

            try {
                const response = await fetch(webhookUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    iconEl.innerText = isNFC ? "📲" : "🌐";
                    iconEl.style.animation = "none";
                    titleEl.innerText = isNFC ? "NFC Card Processed!" : "Web Visit Logged!";
                    statusEl.innerText = "Payload successfully delivered to Discord.";

                    if (customRedirect) {
                        let countdown = 3;
                        redirectEl.style.display = "block";
                        redirectEl.innerText = `Redirecting in ${countdown}s...`;

                        const timer = setInterval(() => {
                            countdown--;
                            if (countdown > 0) {
                                redirectEl.innerText = `Redirecting in ${countdown}s...`;
                            } else {
                                clearInterval(timer);
                                window.location.href = customRedirect;
                            }
                        }, 1000);
                    }
                } else {
                    throw new Error("HTTP " + response.status);
                }
            } catch (err) {
                iconEl.innerText = "❌";
                iconEl.style.animation = "none";
                titleEl.innerText = "Delivery Failed";
                statusEl.innerText = "Could not transmit payload to Discord.";
            }
        }

        window.addEventListener('DOMContentLoaded', processNFC);
    </script>
</body>
</html>
