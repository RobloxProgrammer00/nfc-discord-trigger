<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Trigger</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 320px;
        }
        .status {
            font-size: 1.2rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div id="icon" style="font-size: 3rem;">⏳</div>
        <div id="status" class="status">Sende Nachricht an Discord...</div>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1271467579327778826/6QuER1e953QFI-HGqb_M4XtSSgyaqvMHxn4ESx3lTp1q9z9bceySSZBDMc0tAe9M-cO3L";

        fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                content: "🚨 **NFC-Karte gescannt!** Jemand hat eben die NFC-Karte ausgelöst."
            })
        })
        .then(response => {
            if (response.ok) {
                document.getElementById("icon").innerText = "✅";
                document.getElementById("status").innerText = "Erfolgreich an Discord gesendet!";
            } else {
                throw new Error("Fehler beim Senden");
            }
        })
        .catch(error => {
            document.getElementById("icon").innerText = "❌";
            document.getElementById("status").innerText = "Fehler beim Senden der Nachricht.";
        });
    </script>
</body>
</html>
